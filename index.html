<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ensures safe-area-inset env() vars work on notched iPhones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Fluxora — Any Stream. Zero Compromise. HLS, DASH, MP4, WebM, local files." />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Fluxora</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Crect width='20' height='20' rx='4' fill='%234c7cf2'/%3E%3Crect x='3' y='10' width='3' height='7' rx='1.4' fill='white'/%3E%3Crect x='8.5' y='5' width='3' height='12' rx='1.4' fill='white'/%3E%3Crect x='14' y='8' width='3' height='9' rx='1.4' fill='white'/%3E%3C/svg%3E" />

    <!-- Connect to the font origins early and fetch the font stylesheet in
         parallel with the page's own CSS (the old CSS @import was fetched
         serially, after the CSS). The stylesheet <link> is still render-blocking;
         the gain is parallelism + preconnect, not asynchronous loading. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- font-display=swap: text renders immediately in system font while Inter
         loads, then swaps in — no invisible text flash (FOIT). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!-- DNS prefetch for the default dev backend (VITE_API_URL may point
         elsewhere in production, in which case this hint is simply unused). -->
    <link rel="dns-prefetch" href="http://localhost:8000" />

    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { height: 100%; }
      body, #root { min-height: 100%; min-height: 100dvh; }
      body {
        background: #0a0a0a;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
